name: ci

on:
  push: {}
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # build/package-release.sh runs `dotnet restore --locked-mode` against
      # the committed packages.lock.json files before publishing, so the
      # test run below reuses that same locked-mode restore instead of
      # resolving packages again.
      - name: Package release
        run: build/package-release.sh --version 0.0.0 --commit "$GITHUB_SHA" --output artifacts/release

      - name: Run tests
        run: dotnet test --solution Cabinet.slnx --no-restore
        env:
          CI: true

      - name: Run release layout end-to-end test
        run: bash build/tests/package-release-e2e-test.sh
        env:
          CABINET_E2E: 1

      - name: Run installer end-to-end test
        run: bash deploy/tests/cabinet-deploy-e2e-test.sh
        env:
          CABINET_E2E: 1

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run lint
        run: build/lint.sh
        env:
          GH_TOKEN: ${{ github.token }}
          CABINET_LINT_NETWORK: 1
