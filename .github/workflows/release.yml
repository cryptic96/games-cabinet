name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: build/validate-release-tag.sh > /dev/null

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore Cabinet.slnx --locked-mode

      - name: Run tests
        run: dotnet test --solution Cabinet.slnx --no-restore
        env:
          CI: true

  package:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      sha256: ${{ steps.digest.outputs.sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: build/validate-release-tag.sh >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Package release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: build/package-release.sh --version "$VERSION" --commit "$GITHUB_SHA" --output artifacts/release

      - name: Record archive digest
        id: digest
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "artifacts/release/cabinet-$VERSION.zip" | awk '{ print $1 }')"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload packaged release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-release
          path: |
            artifacts/release/cabinet-${{ steps.tag.outputs.version }}.zip
            artifacts/release/cabinet-${{ steps.tag.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download packaged release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-release
          path: artifacts/release

      - name: Check the archive is the one that was packaged
        env:
          VERSION: ${{ needs.package.outputs.version }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum "artifacts/release/cabinet-$VERSION.zip" | awk '{ print $1 }')"
          listed="$(awk 'NR == 1 { print $1 }' "artifacts/release/cabinet-$VERSION.zip.sha256")"
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::the downloaded archive is not the packaged archive" >&2; exit 1; }
          [ "$listed" = "$EXPECTED_SHA256" ] || { echo "::error::the downloaded checksum file does not match the packaged archive" >&2; exit 1; }

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/cabinet-${{ needs.package.outputs.version }}.zip

      - name: Save attestation bundle for offline verification
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.package.outputs.version }}
        run: cp "$BUNDLE_PATH" "artifacts/release/cabinet-$VERSION.zip.sigstore.json"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail

          zip_asset="artifacts/release/cabinet-$VERSION.zip"
          checksum_asset="artifacts/release/cabinet-$VERSION.zip.sha256"
          bundle_asset="artifacts/release/cabinet-$VERSION.zip.sigstore.json"

          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" = "true" ]; then
              gh release upload "$TAG" "$zip_asset" "$checksum_asset" "$bundle_asset" --clobber
            else
              echo "::error::Release $TAG already exists and is published; refusing to overwrite it" >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes "Automated draft release. Approve the deploy environment to publish it." \
              "$zip_asset" "$checksum_asset" "$bundle_asset"
          fi

  publish:
    needs: [package, attest]
    environment: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release --clobber

      - name: Verify release checksum
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(awk 'NR == 1 { print $1 }' "release/cabinet-$VERSION.zip.sha256")"
          listed="$(awk 'NR == 1 { print $2 }' "release/cabinet-$VERSION.zip.sha256")"
          actual="$(sha256sum "release/cabinet-$VERSION.zip" | awk '{ print $1 }')"
          [ "$listed" = "cabinet-$VERSION.zip" ] || { echo "::error::the checksum file lists $listed" >&2; exit 1; }
          [ "$expected" = "$actual" ] || { echo "::error::checksum mismatch for cabinet-$VERSION.zip" >&2; exit 1; }

      - name: Re-verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          gh attestation verify "release/cabinet-$VERSION.zip" \
            --bundle "release/cabinet-$VERSION.zip.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" \
            --deny-self-hosted-runners

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
