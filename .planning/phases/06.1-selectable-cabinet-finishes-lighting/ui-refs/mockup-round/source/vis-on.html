<body class="sheet" style="--cols:7;--cellw:260px;">

<div class="grid">
<figure class="cell"><div class="stage" data-design="modern" data-wood="brown" data-backs="wood" data-lights="on" data-depth="flat" data-dim="off" data-lit><div class="cabinet" style="--mh:200px"><div class="section" style="--section-w:400;--section-h:240;--frame:20">
<div class="section-floor" aria-hidden="true"></div>
<div class="section-body"><div class="cubby" data-board="0" data-row-end="true" style="--x:0;--y:0;--w:360;--h:200"><div class="cubby-deco" aria-hidden="true"></div><button type="button" class="placement" data-kind="cover" data-pattern="plain" style="--x:30;--y:0;--w:150;--h:150;--bg:#17766f;--fg:#ffffff"><span class="cover-plate"><span class="placement-label"></span></span></button></div></div>
<div class="section-top" aria-hidden="true"></div><div class="section-trim" aria-hidden="true"></div><div class="section-base" aria-hidden="true"></div>
<div class="section-light" aria-hidden="true"><div class="light-pool" style="--x:0;--y:0;--w:360;--h:200"></div></div>
</div></div></div><figcaption><strong>Warm brown back</strong><span>lamp lit (peak near the top, tail lower down)</span></figcaption></figure>
