<!doctype html><meta charset=utf-8><title>fit</title>
<style>
body{margin:0;padding:24px;background:#3b2416;font:14px system-ui;color:#efe3c2}
.row{display:flex;align-items:flex-end;gap:12px;background:#2a1a10;padding:24px 16px 6px;margin-bottom:16px;position:relative}
.row::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgb(20 10 4/.2),transparent 20%)}
.b{position:relative;overflow:hidden;box-shadow:inset 1px 1px 0 rgb(255 255 255/.2),0 1px 2px rgb(0 0 0/.5);padding:0;border:0;flex:none}
.b img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.sp{display:flex;align-items:center;justify-content:center;font-weight:600}
.sp span{writing-mode:vertical-rl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:calc(100% - 20px);font-size:12px;line-height:1.2}
small{display:block;margin:4px 0 12px}
</style>
<script>
const svg=(w,h,body)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${body}</svg>`);
const flat=(w,h,c1,c2)=>svg(w,h,`<rect width="${w}" height="${h}" fill="${c1}"/><circle cx="${w/2}" cy="${h*0.45}" r="${w*0.3}" fill="${c2}"/><rect x="0" y="${h*0.8}" width="${w}" height="${h*0.2}" fill="#111"/>`);
const shot=(w,h)=>svg(w,h,`<rect width="${w}" height="${h}" fill="#fafafa"/><polygon points="${w*.15},${h*.3} ${w*.7},${h*.2} ${w*.85},${h*.75} ${w*.25},${h*.85}" fill="#b3261e"/><polygon points="${w*.7},${h*.2} ${w*.85},${h*.75} ${w*.95},${h*.7} ${w*.8},${h*.18}" fill="#7a1a15"/>`);
window.onload=()=>{
 const rows=document.querySelectorAll('.row');
 const covers=[
  ['A. art aspect = box aspect (no bars)',140,196,'#1d4e89',flat(280,392,'#1d4e89','#f2c14e')],
  ['B. art 10% wider than box: top/bottom bars take the edge colour',140,196,'#1d4e89',flat(308,392,'#1d4e89','#f2c14e')],
  ['C. art 12% narrower: side bars',140,196,'#1d4e89',flat(246,392,'#1d4e89','#f2c14e')],
  ['D. 3D shot on plain backdrop, fill = backdrop colour',140,196,'#fafafa',shot(400,400)],
  ['E. same shot, fill = art colour (rejected)',140,196,'#b3261e',shot(400,400)],
 ];
 for(const [t,w,h,fill,src] of covers){const d=document.createElement('div');const b=document.createElement('div');b.className='b';b.style.cssText=`width:${w}px;height:${h}px;background:${fill}`;const i=new Image();i.src=src;b.append(i);d.append(b);const s=document.createElement('small');s.textContent=t;s.style.width='150px';d.append(s);rows[0].append(d);}
 const sp=[[59*.409,'Phone 59mm tap floor','#7a2f8f','#fff'],[34*.454,'Desktop 34mm','#d98e04','#000'],[24,'24px','#2e7d6b','#fff'],[15.4,'15px desktop floor','#1d4e89','#fff'],[48*.454,'Desktop 48mm','#b8481a','#fff'],[100*.454,'Desktop 100mm','#8fbfe0','#000']];
 for(const [w,t,bg,fg] of sp){const b=document.createElement('div');b.className='b sp';b.style.cssText=`width:${w}px;height:150px;background:${bg};color:${fg}`;const s=document.createElement('span');s.textContent='Quenwick Ormgrave';b.title=t;b.append(s);rows[1].append(b);}
};
</script>
<div class=row></div><div class=row></div>
